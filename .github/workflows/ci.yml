name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verificar (sem banco)
    runs-on: ubuntu-latest
    env:
      # Placeholders apenas para satisfazer prisma.config.ts e imports que
      # leem env no carregamento. Nenhum teste conecta no banco.
      DATABASE_URL: postgresql://user:pass@localhost:5432/isb_test?schema=public
      DIRECT_URL: postgresql://user:pass@localhost:5432/isb_test?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Checar tipos
        run: npx tsc --noEmit

      - name: Testes
        run: npm run test:run

      - name: Build
        run: npm run build

  migrations:
    name: Status das migrations (staging)
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.STAGING_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar se o banco de staging está configurado
        id: db
        run: |
          if [ -n "$DIRECT_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checar migrations
        if: steps.db.outputs.configured == 'true'
        run: npx prisma migrate status
